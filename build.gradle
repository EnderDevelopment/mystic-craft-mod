plugins {
    id 'net.neoforged.gradle.userdev' version '6.0.121'
}

repositories {
    maven {
        name = 'NeoForge'
        url = 'https://maven.neoforged.net/releases'
    }
    mavenCentral()
}

processResources {
    inputs.property "version", project.version
    inputs.property "mcversion", project.minecraft.version
}

project.ext {
    mainMod = "magic_world"
    mod_version = "1.0.0"
    minecraft_version = "1.20.1"
    loader_version = "47.1.0"
    maven_group = "com.enderdevelopment"
    archives_base_name = "magic_world"
}

dependencies {
    minecraft "net.neoforged:neoforge:${loader_version}_minecraft-${minecraft_version}"
    mappings "net.neoforged:neoforge:${loader_version}:mappings"
}

jar {
    from {
        configurations.compileClasspath.collect {
            it.isDirectory() ? it : zipTree(it)
        }
    }
}

sourceSets {
    main {
        resources {
            srcDirs = ["src/main/resources"]
        }
    }
}

configure(jar) {
    archiveFileName.set "${archives_base_name}-${mod_version}.jar"
}